name: Autonomous Engineering Lab

on:
  schedule:
    - cron: "37 8 * * 2"
  workflow_dispatch:
  pull_request_target:
    types: [opened, synchronize, reopened]
  workflow_run:
    workflows: ["ci"]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: autonomous-lab-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  repo-medic:
    if: github.event_name != 'pull_request_target'
    permissions:
      contents: read
    uses: asp53826/portfolio-ops/.github/workflows/repo-medic.yml@v1.2.0
    with:
      runtime: python
      runtime-version: "3.12"
      install-command: >-
        python -m pip install numpy pytest jsonschema
      test-command: >-
        python -m pytest -q

  documentation-scribe:
    if: github.event_name != 'pull_request_target'
    permissions:
      contents: read
      issues: write
    uses: asp53826/portfolio-ops/.github/workflows/documentation-scribe.yml@v1.0.0

  dependency-caretaker:
    if: github.event_name == 'pull_request_target' && github.actor == 'dependabot[bot]'
    permissions:
      pull-requests: write
    uses: asp53826/portfolio-ops/.github/workflows/dependency-caretaker.yml@v1.1.0

  dependency-merger:
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      startsWith(github.event.workflow_run.head_branch, 'dependabot/')
    permissions:
      actions: read
      checks: read
      contents: write
      pull-requests: write
    uses: asp53826/portfolio-ops/.github/workflows/dependency-merger.yml@v1.1.0
